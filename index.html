<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Fuentes alojadas en /public/fonts (ver src/styles/fonts.css). Solo se precarga la del titular del hero -->
    <link rel="preload" href="/fonts/unbounded-latin.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Etiquetas Meta Básicas -->
    <!-- Título y descripción deben coincidir con el <Helmet> de src/pages/MainPage.jsx -->
    <title>Diseño y desarrollo web y app | Katan Studio</title>
    <!-- data-rh: Helmet la sustituye por la descripción propia de cada página -->
    <meta name="description" content="Estudio de desarrollo web en Toledo. Webs y aplicaciones a medida." data-rh="true">

    <!-- Open Graph / Facebook / WhatsApp / Instagram -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://katan.es/">
    <meta property="og:title" content="Diseño y desarrollo web y app | Katan Studio">
    <meta property="og:description" content="Estudio de desarrollo web en Toledo. Webs y aplicaciones a medida.">
    <!-- AQUÍ ESTÁ TU RUTA ESPECÍFICA -->
    <meta property="og:image" content="https://katan.es/logos/wetransfer_katan_2026-05-04_0628/KATANLogoNegroCompleto.png">

    <!-- Twitter / X -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://katan.es/">
    <meta property="twitter:title" content="Diseño y desarrollo web y app | Katan Studio">
    <meta property="twitter:description" content="Estudio de desarrollo web en Toledo. Webs y aplicaciones a medida.">
    <!-- AQUÍ ESTÁ TU RUTA ESPECÍFICA -->
    <meta property="twitter:image" content="https://katan.es/logos/wetransfer_katan_2026-05-04_0628/KATANLogoNegroCompleto.png">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
