name: Despliegue Producción (Frontend)

on:
  push:
    branches: ['main']

jobs:
  deploy-production:
    name: Despliegue en VPS Hetzner
    runs-on: ubuntu-latest
    steps:
      - name: Ejecutar comandos de despliegue vía SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            # 1. Navegar al directorio del proyecto
            cd /var/www/${{ secrets.PROJECT_NAME }}
            # 2. Descargar el código nuevo
            git pull origin main
            # 3. Frontend: Instalar dependencias y compilar
            pnpm install --frozen-lockfile
            pnpm run build
            # 4. Recargar Nginx para servir los nuevos estáticos
            systemctl reload nginx